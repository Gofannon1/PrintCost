<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Cost Calculator</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #16a34a;
        padding: 40px;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #1d4ed8;
    }

    .results {
        margin-top: 25px;
        background: #f8fafc;
        border-radius: 8px;
        padding: 15px;
    }

    .result-row {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
    }

    .total {
        font-size: 1.2em;
        font-weight: bold;
        color: #16a34a;
        border-top: 2px solid #ddd;
        padding-top: 10px;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🖨️ 3D Print Cost Calculator</h1>

    <div class="form-group">
        <label>Weight (g)</label>
        <input type="number" id="weight" value="125">
    </div>

    <div class="form-group">
        <label>Material</label>
        <select id="material">
            <option value="25">PLA ($25/kg)</option>
            <option value="30">PETG ($30/kg)</option>
            <option value="28">ABS ($28/kg)</option>
            <option value="40">TPU ($40/kg)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Print Time (hours)</label>
        <input type="number" id="printTime" value="8">
    </div>

    <div class="form-group">
        <label>Machine Rate ($/hr)</label>
        <input type="number" id="machineRate" value="1.50" step="0.01">
    </div>

    <div class="form-group">
        <label>Electricity Cost ($/hr)</label>
        <input type="number" id="electricityRate" value="0.10" step="0.01">
    </div>

    <div class="form-group">
        <label>Profit Margin (%)</label>
        <input type="number" id="margin" value="30">
    </div>

    <button onclick="calculateCost()">Calculate</button>

    <div class="results">
        <div class="result-row">
            <span>Material Cost</span>
            <span id="materialCost">$0.00</span>
        </div>

        <div class="result-row">
            <span>Machine Cost</span>
            <span id="machineCost">$0.00</span>
        </div>

        <div class="result-row">
            <span>Electricity Cost</span>
            <span id="electricityCost">$0.00</span>
        </div>

        <div class="result-row total">
            <span>Selling Price</span>
            <span id="sellingPrice">$0.00</span>
        </div>
    </div>
</div>

<script>
function calculateCost() {

    const weight = parseFloat(document.getElementById("weight").value);
    const materialPrice = parseFloat(document.getElementById("material").value);
    const printTime = parseFloat(document.getElementById("printTime").value);
    const machineRate = parseFloat(document.getElementById("machineRate").value);
    const electricityRate = parseFloat(document.getElementById("electricityRate").value);
    const margin = parseFloat(document.getElementById("margin").value);

    const materialCost = (weight / 1000) * materialPrice;
    const machineCost = printTime * machineRate;
    const electricityCost = printTime * electricityRate;

    const totalCost =
        materialCost +
        machineCost +
        electricityCost;

    const sellingPrice =
        totalCost * (1 + margin / 100);

    document.getElementById("materialCost").textContent =
        "$" + materialCost.toFixed(2);

    document.getElementById("machineCost").textContent =
        "$" + machineCost.toFixed(2);

    document.getElementById("electricityCost").textContent =
        "$" + electricityCost.toFixed(2);

    document.getElementById("sellingPrice").textContent =
        "$" + sellingPrice.toFixed(2);
}

calculateCost();
</script>

</body>
</html>
